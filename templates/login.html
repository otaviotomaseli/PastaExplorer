<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PastaExplorer - Login</title>
<script>try{const t=localStorage.getItem("theme")||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
:root{--bg:#0078d4;--card:#fff;--text:#222;--text2:#666;--border:#ccc;--input:#fff;--error-bg:#fde7e9;--error-text:#a4262c;--error-border:#f5c2c7}
[data-theme="dark"]{--bg:#0a0a0a;--card:#1e1e1e;--text:#cccccc;--text2:#9e9e9e;--border:#3e3e42;--input:#252526;--error-bg:#3a1a1a;--error-text:#f48771;--error-border:#5a2a2a}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;transition:background .2s}
.card{background:var(--card);width:380px;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.3);overflow:hidden;border:1px solid var(--border)}
.header{background:#0078d4;color:#fff;padding:24px;text-align:center;position:relative}
.header h1{font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.header p{opacity:.9;margin-top:6px;font-size:13px}
.body{padding:28px}
label{font-size:13px;color:var(--text);font-weight:600;display:block;margin-bottom:6px}
input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:4px;font-size:14px;outline:none;margin-bottom:16px;background:var(--input);color:var(--text)}
input:focus{border-color:#0078d4;box-shadow:0 0 0 2px rgba(0,120,212,.2)}
button#btnLogin{width:100%;padding:11px;background:#0078d4;color:#fff;border:none;border-radius:4px;font-size:14px;font-weight:600;cursor:pointer}
button#btnLogin:hover{background:#106ebe}
button#btnLogin:active{background:#005a9e}
.error{background:var(--error-bg);color:var(--error-text);padding:10px 12px;border-radius:4px;font-size:13px;margin-bottom:16px;border:1px solid var(--error-border)}
.info{font-size:12px;color:var(--text2);text-align:center;margin-top:16px}
.icon-folder{width:28px;height:28px;background:#ffb900;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.btn-theme{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px}
.btn-theme:hover{background:rgba(255,255,255,.3)}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <button type="button" id="btnThemeLogin" class="btn-theme" title="Alternar tema">🌙</button>
    <h1><span class="icon-folder">📁</span> PastaExplorer</h1>
    <p>Explorador de Arquivos Web</p>
  </div>
  <div class="body">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div id="errorJs" class="error" style="display:none"></div>
    <form id="loginForm" method="POST">
      <div id="step1">
        <label>Usuário</label>
        <input type="text" name="username" id="username" placeholder="Admin" value="Admin" required>
        <label>Senha</label>
        <input type="password" name="password" id="password" placeholder="••••••••" required>
        <button type="submit" id="btnLogin">Entrar</button>
      </div>
      <div id="step2" style="display:none">
        <div style="text-align:center;margin-bottom:16px">
          <div style="font-size:32px;margin-bottom:8px">🔐</div>
          <div style="font-size:14px;font-weight:600;color:var(--text)" id="step2Title">Verificação em duas etapas</div>
          <div style="font-size:12px;color:var(--text2);margin-top:4px" id="step2Desc">Digite o código de 6 dígitos do seu app autenticador</div>
        </div>
        <label>Código 2FA</label>
        <input type="text" id="code" placeholder="123456" maxlength="6" inputmode="numeric" autocomplete="one-time-code" style="text-align:center;letter-spacing:6px;font-size:20px;font-weight:700">
        <button type="submit" id="btnVerify">Verificar código</button>
        <button type="button" id="btnBack" style="width:100%;margin-top:8px;padding:10px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:13px">← Voltar</button>
      </div>
    </form>
    <div class="info">Acesso total ao computador • Windows & Linux</div>
  </div>
</div>
<script>
(function(){
  const btn=document.getElementById('btnThemeLogin');
  function apply(t){ document.documentElement.setAttribute('data-theme',t); localStorage.setItem('theme',t); btn.textContent=t==='dark'?'☀️ Claro':'🌙 Escuro'; }
  let th=localStorage.getItem('theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  apply(th);
  btn.onclick=()=>{ th=th==='dark'?'light':'dark'; apply(th); };
})();
let pendingUser="", pendingPass="", inStep2=false;
function showStep1(){
  inStep2=false;
  document.getElementById('step1').style.display='block';
  document.getElementById('step2').style.display='none';
  document.getElementById('errorJs').style.display='none';
  document.getElementById('code').value='';
}
function showStep2(username){
  inStep2=true;
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
  document.getElementById('errorJs').style.display='none';
  document.getElementById('step2Title').textContent='Olá, ' + (username||pendingUser);
  document.getElementById('code').focus();
}
document.getElementById('btnBack').addEventListener('click', showStep1);

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const errEl=document.getElementById('errorJs');
  if(!inStep2){
    // etapa 1: usuário e senha
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    if(!u || !p){ errEl.textContent='Preencha usuário e senha'; errEl.style.display='block'; return; }
    pendingUser=u; pendingPass=p;
    const btn=document.getElementById('btnLogin');
    btn.textContent='Verificando...'; btn.disabled=true;
    try{
      const res = await fetch('/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({username:u,password:p})
      });
      const j = await res.json().catch(()=>({}));
      if(res.ok && j.ok){
        location.href='/';
        return;
      }
      if(j.need_2fa){
        showStep2(u);
        errEl.textContent='Senha correta. Agora digite o código 2FA.';
        errEl.style.display='block';
        errEl.style.background='var(--card)';
        errEl.style.borderColor='var(--accent)';
        errEl.style.color='var(--accent)';
        return;
      }
      errEl.textContent=j.error||'Usuário ou senha inválidos';
      errEl.style.display='block';
      errEl.style.background=''; errEl.style.borderColor=''; errEl.style.color='';
    }catch(err){
      errEl.textContent='Erro de conexão';
      errEl.style.display='block';
    }finally{
      btn.textContent='Entrar'; btn.disabled=false;
    }
  } else {
    // etapa 2: código 2FA
    const c = document.getElementById('code').value.trim();
    if(c.length!==6){ errEl.textContent='Código deve ter 6 dígitos'; errEl.style.display='block'; return; }
    const btn=document.getElementById('btnVerify');
    btn.textContent='Verificando...'; btn.disabled=true;
    try{
      const res = await fetch('/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({username:pendingUser,password:pendingPass,code:c})
      });
      const j = await res.json().catch(()=>({}));
      if(res.ok && j.ok){
        location.href='/';
        return;
      }
      errEl.textContent=j.error||'Código inválido';
      errEl.style.display='block';
      document.getElementById('code').value=''; document.getElementById('code').focus();
    }catch(err){
      errEl.textContent='Erro de conexão';
      errEl.style.display='block';
    }finally{
      btn.textContent='Verificar código'; btn.disabled=false;
    }
  }
});
</script>
</body>
</html>
